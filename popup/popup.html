<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LLM Scroll Navigator Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Settings</h2>
    
    <div class="setting-row">
      <label class="setting-label">
        <div class="setting-info">
          <span class="setting-title">Enable Page Navigation</span>
          <span class="setting-desc">Top/Bottom scroll buttons</span>
        </div>
        <div class="toggle-switch">
          <input type="checkbox" id="toggle-page-nav" checked>
          <span class="slider"></span>
        </div>
      </label>
    </div>

    <div class="setting-row">
      <label class="setting-label">
        <div class="setting-info">
          <span class="setting-title">Enable Code Navigation</span>
          <span class="setting-desc">Code block buttons and Alt+W/S</span>
        </div>
        <div class="toggle-switch">
          <input type="checkbox" id="toggle-code-nav" checked>
          <span class="slider"></span>
        </div>
      </label>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
